<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shar Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
    <script src="./main.js" type="module" defer></script>
  </head>
  <body>
    <!-- Modal -->
    <dialog id="global-modal">
      <p id="global-modal-title"></p>
      <div id="global-modal-buttons-container">
        <button id="global-modal-confirm" type="button">Confirm</button>
        <button id="global-modal-close" type="button">Close</button>
      </div>
    </dialog>
    <!-- / Modal -->

    <!-- Main content -->
    <main id="main-content-container" class="hidden fully-centered">
      <div id="project-name-and-icon">
        <span>📝</span>
        <h1>Shar Exam</h1>
      </div>
      <!-- JSON Form -->
      <form id="exam-file-form">
        <div class="exam-file-form-input-container">
          <label for="exam-file-input">Exam</label>
          <input
            type="file"
            accept="application/json"
            name="exam-file-input"
            id="exam-file-input"
          />
          <span id="selected-exam-file-name-preview">No file selected...</span>
        </div>

        <button type="submit">Load Exam File</button>
      </form>
      <!-- / JSON Form -->
    </main>
    <!-- / Main content -->

    <!-- Exam Wrapper -->
    <section id="exam-container" class="hidden">
      <span id="exam-question-title" exam-question-number="1">Question 01</span>
      <div id="exam-question-alternatives-container">
        <div>
          <input
            type="radio"
            name="exam-question-alternative"
            class="exam-question-alternative"
            value="1"
          />
          <span class="exam-question-alternative-text">Alternative 01</span>
        </div>
        <div>
          <input
            type="radio"
            name="exam-question-alternative"
            class="exam-question-alternative"
            value="2"
          />
          <span class="exam-question-alternative-text">Alternative 02</span>
        </div>
        <div>
          <input
            type="radio"
            name="exam-question-alternative"
            class="exam-question-alternative"
            value="3"
          />
          <span class="exam-question-alternative-text">Alternative 03</span>
        </div>
        <div>
          <input
            type="radio"
            name="exam-question-alternative"
            class="exam-question-alternative"
            value="4"
          />
          <span class="exam-question-alternative-text">Alternative 04</span>
        </div>
        <div>
          <input
            type="radio"
            name="exam-question-alternative"
            class="exam-question-alternative"
            value="5"
          />
          <span class="exam-question-alternative-text">Alternative 05</span>
        </div>
      </div>

      <div id="exam-action-buttons-container">
        <button type="button" id="exam-confirm-question-answer">Confirm</button>
        <button type="button" id="exam-cancel">Cancel</button>
      </div>
    </section>
    <!-- / Exam Wrapper -->

    <!-- Final Result Wrapper  -->
    <section id="final-result-container" class="">
      <h1>Final Result</h1>
      <!-- Results Wrapper -->
      <span id="user-final-points">
        <i class="fa-solid fa-star"></i>
        0/5
      </span>
      <div id="final-result-answers">
        <div class="final-result-answer-container">
          <div class="final-result-question-icon-container">
            <i class="fa-solid fa-check"></i>
            <span class="final-result-question-text">Pergunta 01</span>
          </div>
          <div class="final-result-answers-container">
            <div class="final-result-correct-answer">
              <i class="fa-solid fa-robot"></i>
              <span class="final-result-question-correct-answer-text"
                >Alternativa 03</span
              >
            </div>
            <div class="final-result-user-answer">
              <i class="fa-solid fa-user"></i>
              <span class="final-result-user-answer-text">Alternativa 03</span>
            </div>
          </div>
        </div>
      </div>
      <button type="button" id="do-another-exam">
        <i class="fa-solid fa-rotate-left"></i>
        Do another exam
      </button>
      <!-- / Results Wrapper -->
    </section>
    <!-- / Final Result Wrapper  -->
    <script
      src="https://kit.fontawesome.com/85b090ab76.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
